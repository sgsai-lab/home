<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="robots" content="noindex">
  <title>Projects — SGS AI Technology</title>
  <meta name="description" content="Start and manage your SGS AI Technology projects.">
  <link rel="icon" type="image/x-icon" href="/logo/favicon.ico">
  <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/global.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/css/account.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/css/hub.css?v=__ASSET_VERSION__">
  <script src="/assets/js/app.js?v=__ASSET_VERSION__" defer></script>
  <script type="module" src="/assets/js/projects.js?v=__ASSET_VERSION__"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>
  <div id="nav-mount"></div>

  <main id="main" class="auth-main hub-main">
    <div class="section-wrap">
      <header class="hub-page-head">
        <div>
          <h1 class="page-title">Projects</h1>
          <p class="hint">Business engagements and education programmes SGS AI Technology runs with your organisation.</p>
        </div>
        <div class="row-actions">
          <button id="new-project" class="button button-primary" type="button" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            New project
          </button>
        </div>
      </header>
      <p id="page-status" class="form-status" role="alert" hidden></p>

      <section class="panel" aria-labelledby="list-heading">
        <div class="section-head">
          <h2 id="list-heading">All projects</h2>
          <span id="list-summary" class="hint"></span>
        </div>
        <form id="filter-form" class="toolbar" novalidate>
          <label class="field search"><span>Search</span>
            <input name="q" type="search" maxlength="100" placeholder="Search projects, summaries or tags" autocomplete="off">
          </label>
          <label class="field"><span>Workspace</span>
            <select name="client_id"><option value="">All workspaces</option></select>
          </label>
          <label class="field"><span>Sector</span>
            <select name="sector">
              <option value="">Any sector</option>
              <option value="business">Business</option>
              <option value="education">Education</option>
            </select>
          </label>
          <label class="field"><span>Status</span>
            <select name="status">
              <option value="">Any status</option>
              <option value="draft">Draft</option>
              <option value="discovery">Discovery</option>
              <option value="in_progress">In progress</option>
              <option value="on_hold">On hold</option>
              <option value="delivered">Delivered</option>
              <option value="archived">Archived</option>
            </select>
          </label>
          <label class="field"><span>Sort</span>
            <select name="sort">
              <option value="-updated_at">Recently updated</option>
              <option value="-created_at">Newest first</option>
              <option value="name">Name A–Z</option>
              <option value="start_date">Start date</option>
            </select>
          </label>
          <button id="filter-reset" class="link-button toolbar-reset" type="button" hidden>Clear filters</button>
          <button class="visually-hidden" type="submit">Apply filters</button>
        </form>

        <ul id="project-list" class="card-grid"></ul>
        <div class="pager">
          <button id="prev-page" class="button button-secondary button-small" type="button">Previous</button>
          <span id="page-info"></span>
          <button id="next-page" class="button button-secondary button-small" type="button">Next</button>
        </div>
        <p id="list-status" class="form-status" role="status" hidden></p>
      </section>
    </div>
  </main>

  <dialog id="project-dialog" class="sheet" aria-labelledby="editor-heading">
    <div class="sheet-inner">
      <div class="sheet-head">
        <div>
          <h2 id="editor-heading" class="sheet-title">Start a new project</h2>
          <p class="hint">Projects group milestones, deliverables and apps for one workspace.</p>
        </div>
        <button class="sheet-close" type="button" aria-label="Close" data-dialog-close>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="project-form" class="stack" novalidate>
        <div class="sheet-body stack">
          <div class="grid-2">
            <label class="field">Workspace
              <select name="client_id" required></select>
            </label>
            <label class="field">Name
              <input name="name" type="text" required maxlength="120" autofocus>
            </label>
          </div>
          <div class="grid-2">
            <label class="field">Sector
              <select name="sector">
                <option value="business">Business</option>
                <option value="education">Education</option>
              </select>
            </label>
            <label class="field">Status
              <select name="status">
                <option value="draft">Draft</option>
                <option value="discovery">Discovery</option>
                <option value="in_progress">In progress</option>
                <option value="on_hold">On hold</option>
                <option value="delivered">Delivered</option>
                <option value="archived">Archived</option>
              </select>
            </label>
          </div>
          <fieldset id="profile-fields" class="stack">
            <legend id="profile-legend">Details</legend>
            <div id="profile-inputs" class="grid-2"></div>
          </fieldset>
          <label class="field">Summary
            <textarea name="summary" maxlength="2000" placeholder="What are we building together?"></textarea>
          </label>
          <div class="grid-2">
            <label class="field">Start date
              <input name="start_date" type="date">
            </label>
            <label class="field">End date
              <input name="end_date" type="date">
            </label>
          </div>
          <label class="field">Tags (comma separated, up to 20)
            <input name="tags" type="text" maxlength="700" placeholder="pilot, lms">
          </label>
          <label id="template-field" class="field-check">
            <input name="use_template" type="checkbox" checked>
            <span>Start with the standard milestones for this sector</span>
          </label>
        </div>
        <div class="sheet-actions">
          <p id="editor-status" class="form-status" role="status" hidden></p>
          <button id="cancel-edit" class="button button-secondary" type="button" data-dialog-close>Cancel</button>
          <button id="submit-project" class="button button-primary" type="submit">Create project</button>
        </div>
      </form>
    </div>
  </dialog>

  <div id="footer-mount"></div>
</body>
</html>
