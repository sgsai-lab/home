<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="robots" content="noindex">
  <title>Forgot password — SGS AI Technology</title>
  <meta name="description" content="Reset your SGS AI Technology password.">
  <link rel="icon" type="image/x-icon" href="/logo/favicon.ico">
  <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/global.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/css/account.css?v=__ASSET_VERSION__">
  <script src="/assets/js/app.js?v=__ASSET_VERSION__" defer></script>
  <script type="module" src="/assets/js/forgot-password.js?v=__ASSET_VERSION__"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>
  <div id="nav-mount"></div>

  <main id="main" class="auth-main">
    <div class="section-wrap">
      <div class="auth-card">
        <p class="section-kicker">ACCOUNT</p>
        <form id="forgot-form" class="stack" novalidate>
          <h1>Forgot your password?</h1>
          <p class="hint">Enter your email and we will send you a link to choose a new password.</p>
          <label class="field">Email
            <input name="email" type="email" autocomplete="email" required maxlength="254">
          </label>
          <button class="button button-primary" type="submit">Send reset link</button>
          <p class="auth-links"><a href="/login/">Back to sign in</a></p>
        </form>
        <p id="status" class="form-status" role="alert" hidden></p>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>
</body>
</html>
