      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="1" stop-color="#3a1d6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c58bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c58bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b45e0"/>
      <stop offset="1" stop-color="#13a8cf"/>
