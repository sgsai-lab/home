<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password — SGS AI Technology</title>
  <meta name="description" content="Choose a new password for your SGS AI Technology account.">
  <link rel="icon" type="image/x-icon" href="/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/global.css?v=7">
  <link rel="stylesheet" href="/account.css">
  <script src="/app.js?v=7" defer></script>
  <script type="module" src="/js/reset-password.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>
  <div id="nav-mount"></div>

  <main id="main" class="auth-main">
    <div class="section-wrap">
      <div class="auth-card">
        <p class="section-kicker">ACCOUNT</p>
        <form id="reset-form" class="stack" novalidate>
          <h1>Choose a new password</h1>
          <p class="hint">This also activates accounts created by an administrator invitation.</p>
          <label class="field">New password
            <input name="new_password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
          </label>
          <label class="field">Confirm password
            <input name="confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
          </label>
          <label id="mfa-field" class="field" hidden>Authenticator or recovery code
            <input name="mfa" type="text" autocomplete="one-time-code" maxlength="20">
          </label>
          <button class="button button-primary" type="submit">Save password</button>
          <p class="auth-links"><a href="/forgot-password/">Request a new link</a></p>
        </form>
        <p id="status" class="form-status" role="alert" hidden></p>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>
</body>
</html>
