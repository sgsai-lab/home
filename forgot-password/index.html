<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="robots" content="noindex">
  <title>Forgot password — SGS AI Technology</title>
  <meta name="description" content="Reset your SGS AI Technology password.">
  <link rel="icon" type="image/x-icon" href="/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/global.css?v=7">
  <link rel="stylesheet" href="/account.css">
  <script src="/app.js?v=7" defer></script>
  <script type="module" src="/js/forgot-password.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>
  <div id="nav-mount"></div>

  <main id="main" class="auth-main">
    <div class="section-wrap">
      <div class="auth-card">
        <p class="section-kicker">ACCOUNT</p>
        <form id="forgot-form" class="stack" novalidate>
          <h1>Forgot your password?</h1>
          <p class="hint">Enter your email and we will send you a link to choose a new password.</p>
          <label class="field">Email
            <input name="email" type="email" autocomplete="email" required maxlength="254">
          </label>
          <button class="button button-primary" type="submit">Send reset link</button>
          <p class="auth-links"><a href="/login/">Back to sign in</a></p>
        </form>
        <p id="status" class="form-status" role="alert" hidden></p>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>
</body>
</html>
