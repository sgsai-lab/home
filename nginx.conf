server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404.html;

    location = /api/contact {
        limit_req zone=contact_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/analytics {
        limit_req zone=contact_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = / {
        try_files /index.html =404;
        expires 5m;
    }

    location ~ ^/(vision|products|roadmap|about|contact|privacy|terms)$ {
        return 301 /$1/;
    }

    location = /vision/ { try_files /vision/index.html =404; expires 5m; }
    location = /products/ { try_files /products/index.html =404; expires 5m; }
    location = /roadmap/ { try_files /roadmap/index.html =404; expires 5m; }
    location = /about/ { try_files /about/index.html =404; expires 5m; }
    location = /contact/ { try_files /contact/index.html =404; expires 5m; }
    location = /privacy/ { try_files /privacy/index.html =404; expires 5m; }
    location = /terms/ { try_files /terms/index.html =404; expires 5m; }

    location ~* \.html$ {
        try_files $uri =404;
        expires 5m;
    }

    location ~* \.(css|js|webmanifest|svg|ico|png|jpg|jpeg|gif|webp)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / { try_files $uri $uri/ =404; }

    location ~ /\. {
        deny all;
    }
}

limit_req_zone $binary_remote_addr zone=contact_api:10m rate=10r/m;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;
