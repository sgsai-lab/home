server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    limit_req_status 429;

    # Performance: Gzip and Brotli Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    # (Assuming Brotli is enabled via nginx modules in production: brotli on; brotli_comp_level 6; brotli_types ...)


    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # storage.googleapis.com: signed uploads (connect) and signed/public reads of client media (img, media).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://appleid.cdn-apple.com; style-src 'self' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com https://storage.googleapis.com; media-src 'self' https://storage.googleapis.com; connect-src 'self' https://accounts.google.com/gsi/ https://appleid.apple.com https://storage.googleapis.com; frame-src https://accounts.google.com/gsi/ https://appleid.apple.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404.html;

    location = /api/contact {
        limit_req zone=contact_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Client hub API (ADR-002: served by this container's Node API). API_UPSTREAM is substituted at container start.
    location ^~ /api/v1/ {
        client_max_body_size 1m;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/readyz {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Launch links for client apps (/go/{slug}); unknown slugs get the branded 404 page.
    location ^~ /go/ {
        limit_req zone=launch burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 /404.html;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Android App Links and iOS Universal Links, generated by the API from configuration.
    # Served as JSON without redirects; ^~ keeps the dotfile deny rule below from matching.
    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /.well-known/apple-app-site-association {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location ^~ /.well-known/ {
        return 404;
    }

    # The service worker must revalidate on every load so new deploys are picked up.
    location = /sw.js {
        expires -1;
    }

    location = /api/config {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/analytics {
        limit_req zone=contact_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }


    # Caching uses `expires` only: any add_header inside a location would drop the
    # server-level security headers (CSP, X-Frame-Options, ...) for that location.
    location ~* \.html$ {
        expires 5m;
    }

    location = / {
        try_files /index.html =404;
        expires 5m;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Unhashed filenames: revalidate scripts/styles so deploys take effect (ETag keeps this cheap).
    location ~* \.(css|js)$ {
        expires -1;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }
}

# On Cloud Run $remote_addr is Google's front end, shared by every visitor. The front end appends the
# real client address as the last X-Forwarded-For entry; the API (clientAddress) reads the same entry,
# so the header is passed through unchanged rather than extended with $proxy_add_x_forwarded_for.
map $http_x_forwarded_for $client_ip {
    "~(?<last>[^,\s]+)\s*$" $last;
    default $remote_addr;
}

limit_req_zone $client_ip zone=contact_api:10m rate=10r/m;
limit_req_zone $client_ip zone=launch:10m rate=120r/m;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;
