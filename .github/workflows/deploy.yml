name: Deploy website to Cloud Run

on:
  push:
    branches: [main]
    # Deploy only when the production image or its rollout changes. CI, docs,
    # agents, skills, tests, infra, and other tooling changes do not redeploy.
    # .github/actions/** and scripts/check-container.sh are excluded: they gate
    # the deploy but ship nothing, and CI runs them on every PR before merge.
    # test/deploy.test.mjs fails if a Dockerfile or build input is missing here.
    paths:
      - public/**
      - src/**
      - config/**
      - scripts/build.mjs
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
  # Manual redeploy of main, e.g. after changing repository variables or secrets.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: website-production-deploy
  cancel-in-progress: false

jobs:
  build-publish-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and smoke-test commit-tagged container
        uses: ./.github/actions/container-check
        with:
          tag: sgs-ai-website:${{ github.sha }}
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
      - name: Push SHA-tagged image to Artifact Registry
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/sgs-ai-website:$IMAGE_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker tag "sgs-ai-website:$IMAGE_SHA" "$image"
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          CONTACT_FROM: ${{ vars.CONTACT_FROM }}
          SMTP_USER_SECRET: ${{ vars.SMTP_USER_SECRET }}
          SMTP_PASS_SECRET: ${{ vars.SMTP_PASS_SECRET }}
          # Client hub (ADR-002). All optional: features that need them report 503 until set.
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
          APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
          APPLE_ANDROID_PACKAGES: ${{ vars.APPLE_ANDROID_PACKAGES }}
          MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET }}
          PUBLIC_ASSETS_BUCKET: ${{ vars.PUBLIC_ASSETS_BUCKET }}
          MFA_ENCRYPTION_KEY_SECRET: ${{ vars.MFA_ENCRYPTION_KEY_SECRET }}
          APPLE_STATE_SECRET_SECRET: ${{ vars.APPLE_STATE_SECRET_SECRET }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          secrets=""
          if [[ -n "$SMTP_USER_SECRET" && -n "$SMTP_PASS_SECRET" ]]; then
            secrets="SMTP_USER=$SMTP_USER_SECRET:latest,SMTP_PASS=$SMTP_PASS_SECRET:latest"
          elif [[ -n "$SMTP_USER_SECRET" || -n "$SMTP_PASS_SECRET" ]]; then
            echo "Set both SMTP_USER_SECRET and SMTP_PASS_SECRET, or leave both unset." >&2
            exit 1
          fi
          if [[ -n "${MFA_ENCRYPTION_KEY_SECRET:-}" ]]; then
            secrets="${secrets:+$secrets,}MFA_ENCRYPTION_KEY=$MFA_ENCRYPTION_KEY_SECRET:latest"
          fi
          if [[ -n "${APPLE_STATE_SECRET_SECRET:-}" ]]; then
            secrets="${secrets:+$secrets,}APPLE_STATE_SECRET=$APPLE_STATE_SECRET_SECRET:latest"
          fi
          secret_args=()
          if [[ -n "$secrets" ]]; then
            secret_args+=(--set-secrets "$secrets")
          fi
          # "|" delimiter (gcloud ^|^ syntax) because GOOGLE_CLIENT_IDS and similar values contain commas.
          env_vars=""
          add_env() {
            if [[ -z "$2" ]]; then return 0; fi
            if [[ "$2" == *"|"* ]]; then
              echo "$1 must not contain '|'." >&2
              exit 1
            fi
            env_vars="${env_vars:+$env_vars|}$1=$2"
          }
          add_env GCP_PROJECT_ID "$GCP_PROJECT_ID"
          add_env SMTP_HOST "${SMTP_HOST:-}"
          add_env SMTP_PORT 587
          add_env SMTP_SECURE false
          add_env CONTACT_FROM "${CONTACT_FROM:-}"
          add_env CONTACT_TO hello@sgsaitechnology.com
          add_env GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
          add_env APPLE_CLIENT_ID "${APPLE_CLIENT_ID:-}"
          add_env SITE_ORIGIN "${SITE_ORIGIN:-}"
          add_env ADMIN_EMAILS "${ADMIN_EMAILS:-}"
          add_env GOOGLE_CLIENT_IDS "${GOOGLE_CLIENT_IDS:-}"
          add_env APPLE_CLIENT_IDS "${APPLE_CLIENT_IDS:-}"
          add_env APPLE_ANDROID_PACKAGES "${APPLE_ANDROID_PACKAGES:-}"
          add_env MEDIA_BUCKET "${MEDIA_BUCKET:-}"
          add_env PUBLIC_ASSETS_BUCKET "${PUBLIC_ASSETS_BUCKET:-}"
          add_env ANDROID_CERT_SHA256 "${ANDROID_CERT_SHA256:-}"
          add_env APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
          gcloud run deploy sgs-ai-website \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --port 8080 \
            --min 0 \
            --max 5 \
            --memory 256Mi \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --ingress all \
            --set-env-vars "^|^$env_vars" \
            "${secret_args[@]}"