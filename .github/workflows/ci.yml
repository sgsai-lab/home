name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and validate HTML, CSS, JavaScript, and local links
        run: npm run lint
      - name: Test contact API validation and rate limiting
        run: npm test
      - name: Build minified static site
        run: npm run build
      - name: Enforce Lighthouse CI budgets
        run: npm run lighthouse
      - name: Build container image
        run: docker build --tag sgs-ai-website:${{ github.sha }} .
      - name: Verify container startup on Cloud Run port
        run: bash scripts/check-container.sh sgs-ai-website:${{ github.sha }}