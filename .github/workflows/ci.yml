name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and validate HTML, CSS, JavaScript, and local links
        run: npm run lint
      - name: Test contact API validation and rate limiting
        run: npm test
      - name: Build minified static site
        run: npm run build
      - name: Enforce Lighthouse CI budgets
        run: npm run lighthouse
      - name: Build container image
        run: docker build --tag sgs-ai-website:${{ github.sha }} .
      - name: Scan fixable HIGH and CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.28.0
        with:
          image-ref: sgs-ai-website:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL