name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js and cached dependencies
        uses: ./.github/actions/setup-node-project
      - name: Lint and validate HTML, CSS, JavaScript, and local links
        run: npm run lint
      - name: Test API behavior and static build boundaries
        run: npm test
      - name: Build minified static site
        run: npm run build
      - name: Validate deployed page links and dynamic fragments
        run: npm run check:dist
      - name: Build and smoke-test container image
        uses: ./.github/actions/build-site-image
        with:
          tag: sgs-ai-website:${{ github.sha }}