name: Build site image
description: Build the production container with a BuildKit layer cache shared by CI and deploy, load it locally, and smoke-test it.

inputs:
  tag:
    description: Local image tag to build and verify.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Build container image
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        load: true
        tags: ${{ inputs.tag }}
        cache-from: type=gha,scope=sgs-ai-website
        cache-to: type=gha,scope=sgs-ai-website,mode=max

    - name: Verify container startup on Cloud Run port
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.tag }}
      run: bash scripts/check-container.sh "$IMAGE_TAG"
