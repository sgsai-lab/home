name: Set up Node.js toolchain
description: >-
  Shared Node.js setup for every workflow job. Installs the pinned Node.js
  version, restores npm and node_modules caches keyed on package-lock.json so
  later runs skip `npm ci`, and optionally installs a cached, pinned Copilot CLI.

inputs:
  install-dependencies:
    description: Run `npm ci` (skipped when node_modules is restored from cache).
    required: false
    default: "true"
  copilot-cli-version:
    description: Pinned @github/copilot version to install and cache. Empty skips it.
    required: false
    default: ""

outputs:
  node-modules-cache-hit:
    description: Whether node_modules was restored from cache.
    value: ${{ steps.node-modules.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.install-dependencies == 'true' && 'npm' || '' }}

    - name: Restore node_modules cache
      id: node-modules
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true' && steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Restore cached Copilot CLI
      id: copilot-cli
      if: inputs.copilot-cli-version != ''
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/copilot-cli
        key: copilot-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.copilot-cli-version }}

    - name: Install pinned Copilot CLI
      if: inputs.copilot-cli-version != '' && steps.copilot-cli.outputs.cache-hit != 'true'
      shell: bash
      env:
        COPILOT_CLI_VERSION: ${{ inputs.copilot-cli-version }}
      run: npm install --prefix "$RUNNER_TEMP/copilot-cli" "@github/copilot@$COPILOT_CLI_VERSION"

    - name: Add Copilot CLI to PATH
      if: inputs.copilot-cli-version != ''
      shell: bash
      run: echo "$RUNNER_TEMP/copilot-cli/node_modules/.bin" >> "$GITHUB_PATH"
